<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-label="A real console clock's error over a week" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>A real console clock's error over a week</title>
<desc>Hourly readings of one Davis Envoy's clock error for seven days with no clock set.  Each day the error falls steadily, by 3.13 seconds, and just after midnight it rises again by the console's own jump of 3.25 seconds: a sawtooth, from about 1.6 seconds fast just after midnight to about 1.6 seconds slow just before the next.</desc>
