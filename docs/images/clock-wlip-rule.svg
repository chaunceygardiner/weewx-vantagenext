<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-label="How far off center the clock is each evening, under the WeatherLinkIP rule" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>The WeatherLinkIP rule, night by night</title>
<desc>How far off center a console that loses 2.45 seconds a day stands each evening, with no reading noise, from two starts.  From 1.7 seconds behind, more than a second off, the first jump, 4.25, brings it in at once, and the jump then goes to 2.25 and then 2.50.  From 0.8 seconds behind, the jump written is 2.75, the quarter-second next to the drift being too slow, and the clock crosses the band over a few nights, the jump then going to 2.25 and then 2.50.</desc>
<rect width="760" height="360" fill="#fcfcfb"/>
<text x="58" y="22" font-size="14" font-weight="600" fill="#0b0b0b">Off center each evening, seconds, with no reading noise</text>
<rect x="58" y="99.4" width="684" height="63.9" fill="#2a78d6" fill-opacity="0.12"/>
