<line x1="58" y1="40.0" x2="742" y2="40.0" stroke="#898781" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="58" y1="314.0" x2="742" y2="314.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="50" y="318.0" font-size="12" text-anchor="end" fill="#898781">-2</text>
<line x1="58" y1="222.7" x2="742" y2="222.7" stroke="#e1e0d9" stroke-width="1"/>
<text x="50" y="226.7" font-size="12" text-anchor="end" fill="#898781">-1</text>
<text x="50" y="135.3" font-size="12" text-anchor="end" fill="#898781">0</text>
<line x1="58" y1="40.0" x2="742" y2="40.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="50" y="44.0" font-size="12" text-anchor="end" fill="#898781">+1</text>
<line x1="58" y1="131.3" x2="742" y2="131.3" stroke="#898781" stroke-width="1"/>
<text x="738" y="217.7" font-size="12" text-anchor="end" fill="#52514e">a second off</text>
<text x="89.1" y="332" font-size="12" text-anchor="middle" fill="#898781">1</text>
