<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-label="A real console clock's error, steered, over 13 days" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>A real console clock's error, steered, over 13 days</title>
<desc>The readings the driver kept of one Davis Envoy's clock error for 13 days, two a day, and the sawtooth its fit draws through them.  The console loses 3.33 seconds a day.  It held a 2.50-second jump when the record opens, too small, and for two days the sawtooth creeps down.  Then the driver writes 4.25, and that midnight brings the clock back into the band around center; from then on the jump moves between 3.25 and 3.50, a night or a few at a time, and the clock stays in the band.  The clock is never set.</desc>
