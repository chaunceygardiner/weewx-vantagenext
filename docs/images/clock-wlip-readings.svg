<circle cx="668.4" cy="256.9" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="400.0" y="58.3" font-size="12" text-anchor="middle" fill="#52514e">dots: the readings, each good to half a second either way (the bars); line: the driver's fit, drift -2.51 s a day</text>
