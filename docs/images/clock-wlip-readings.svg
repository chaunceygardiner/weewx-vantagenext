<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-label="A WeatherLinkIP console's whole-second clock readings" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>A WeatherLinkIP console's whole-second clock readings</title>
<desc>The 38 whole-second readings the driver kept of a console behind a WeatherLinkIP, one at each four-hourly clock check but any that fell in the first ten minutes of a day, each good only to half a second either way, and the line the driver fits through them: the sawtooth of a clock that loses 2.41 seconds a day and gains back its jump at each midnight, 2.25 seconds when the record opens.  The readings scatter around the line; the line is known far better than any one of them.  Where the driver wrote a new jump, the figure says so at the midnight it was first made.</desc>
