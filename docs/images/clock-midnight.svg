<line x1="58" y1="286.6" x2="742" y2="286.6" stroke="#898781" stroke-width="1"/>
<text x="50" y="290.6" font-size="12" text-anchor="end" fill="#898781">0</text>
<line x1="58" y1="231.8" x2="742" y2="231.8" stroke="#e1e0d9" stroke-width="1"/>
<text x="50" y="235.8" font-size="12" text-anchor="end" fill="#898781">+1</text>
<line x1="58" y1="177.0" x2="742" y2="177.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="50" y="181.0" font-size="12" text-anchor="end" fill="#898781">+2</text>
<line x1="58" y1="122.2" x2="742" y2="122.2" stroke="#e1e0d9" stroke-width="1"/>
<text x="50" y="126.2" font-size="12" text-anchor="end" fill="#898781">+3</text>
<line x1="58" y1="67.4" x2="742" y2="67.4" stroke="#e1e0d9" stroke-width="1"/>
<text x="50" y="71.4" font-size="12" text-anchor="end" fill="#898781">+4</text>
<text x="58.0" y="332" font-size="12" text-anchor="middle" fill="#898781">-20 s</text>
<text x="172.0" y="332" font-size="12" text-anchor="middle" fill="#898781">-10 s</text>
<text x="286.0" y="332" font-size="12" text-anchor="middle" fill="#898781">midnight</text>
<text x="400.0" y="332" font-size="12" text-anchor="middle" fill="#898781">+10 s</text>
<text x="514.0" y="332" font-size="12" text-anchor="middle" fill="#898781">+20 s</text>
<text x="628.0" y="332" font-size="12" text-anchor="middle" fill="#898781">+30 s</text>
<line x1="286.0" y1="40" x2="286.0" y2="314" stroke="#898781" stroke-width="1" stroke-dasharray="2 3"/>
<text x="290.0" y="56.4" font-size="12" fill="#52514e">no answer</text>
