<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-label="A console making its midnight jump" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>A console making its midnight jump</title>
<desc>Precise readings of a console clock, one a second, from twenty seconds before its midnight to forty after.  The error is flat before midnight; the console does not answer for the first few seconds of the day; then the error climbs a quarter of a second each second until the jump of 3.75 seconds is made, and is flat again.</desc>
<rect width="760" height="360" fill="#fcfcfb"/>
<text x="58" y="22" font-size="14" font-weight="600" fill="#0b0b0b">How far the clock has moved, seconds, against the console's own time</text>
